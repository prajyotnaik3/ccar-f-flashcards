- id: d1-012
  domain: D1
  weight: 27
  type: decision
  difficulty: medium
  scenarios: [multi_agent_research]
  front: "How should a coordinator select which subagents to invoke?"
  back: "Analyze query requirements and dynamically select needed subagents—not always route through the full pipeline."
  sources:
    - "Official CCAR-F Exam Guide — D1, Task 1.2"
  tags: [coordinator, orchestration]

- id: d1-013
  domain: D1
  weight: 27
  type: decision
  difficulty: medium
  scenarios: [multi_agent_research]
  front: "How partition research scope across subagents to reduce duplication?"
  back: "Assign distinct subtopics or source types per agent (e.g., web vs documents vs synthesis)—not overlapping queries."
  sources:
    - "Official CCAR-F Exam Guide — D1, Task 1.2"
  tags: [decomposition, subagents]

- id: d1-014
  domain: D1
  weight: 27
  type: concept
  difficulty: medium
  scenarios: [multi_agent_research]
  front: "What is an iterative refinement loop in multi-agent research?"
  back: "Coordinator evaluates synthesis for gaps, re-delegates to search/analysis with targeted queries, re-invokes synthesis until coverage is sufficient."
  sources:
    - "Official CCAR-F Exam Guide — D1, Task 1.2"
  tags: [orchestration, refinement]

- id: d1-015
  domain: D1
  weight: 27
  type: decision
  difficulty: medium
  scenarios: [multi_agent_research]
  front: "Why route all subagent communication through the coordinator?"
