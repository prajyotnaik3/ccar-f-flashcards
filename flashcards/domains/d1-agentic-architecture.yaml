# Domain 1: Agentic Architecture & Orchestration (27%)
# Task statements 1.1–1.7 from Official CCAR-F Exam Guide v1.0

- id: d1-001
  domain: D1
  weight: 27
  type: concept
  difficulty: easy
  scenarios: [customer_support, multi_agent_research, developer_productivity]
  front: "What is the agentic loop lifecycle in Claude-based systems?"
  back: "Send request → inspect stop_reason → if tool_use, execute tools and append results to history → repeat until stop_reason is end_turn."
  sources:
    - "Official CCAR-F Exam Guide — D1, Task 1.1"
    - "https://docs.anthropic.com/en/docs/agents-and-tools/agent-sdk/overview"
  tags: [agent_loop, stop_reason]

- id: d1-002
  domain: D1
  weight: 27
  type: decision
  difficulty: medium
  scenarios: [customer_support]
  front: "12% of support cases skip get_customer and call lookup_order by name only, causing wrong refunds. Most effective fix?"
  back: "Programmatic prerequisite: block lookup_order and process_refund until get_customer returns a verified customer ID."
  rationale: "Financial identity steps need deterministic enforcement; prompts and few-shot alone are probabilistic."
  sources:
    - "Official CCAR-F Exam Guide — D1, Task 1.4; Sample Q1"
  tags: [prerequisites, hooks, customer_support]
  exam_day: true

- id: d1-003
  domain: D1
  weight: 27
  type: compare
  difficulty: medium
  scenarios: [multi_agent_research]
  front: "Single agent with many tools vs coordinator + specialized subagents for a research pipeline?"
  back: "Coordinator + subagents when work decomposes (search, analyze, synthesize), needs isolated context, and clear failure boundaries."
  sources:
    - "Official CCAR-F Exam Guide — D1, Task 1.2"
  tags: [orchestration, subagents]

- id: d1-004
  domain: D1
  weight: 27
  type: anti_pattern
  difficulty: medium
  scenarios: [multi_agent_research]
  front: "Why must a coordinator not invent subagent outputs without tool results?"
  back: "Breaks provenance and reliability; delegate via Task tool and pass explicit context—never hallucinate worker findings."
  sources:
    - "Official CCAR-F Exam Guide — D1, Task 1.2–1.3"
  tags: [provenance, subagents]

- id: d1-005
  domain: D1
  weight: 27
  type: concept
  difficulty: easy
  scenarios: [customer_support, multi_agent_research]
  front: "When should an agentic loop continue vs terminate?"
  back: "Continue when stop_reason is tool_use; terminate when stop_reason is end_turn."
  sources:
    - "Official CCAR-F Exam Guide — D1, Task 1.1"
  tags: [agent_loop, stop_reason]
  exam_day: true

- id: d1-006
  domain: D1
  weight: 27
  type: anti_pattern
  difficulty: medium
  scenarios: [customer_support, developer_productivity]
  front: "Agentic loop anti-patterns for termination (name three)."
  back: "Parsing natural language for completion; arbitrary iteration caps as primary stop; treating assistant text as completion signal."
  sources:
    - "Official CCAR-F Exam Guide — D1, Task 1.1"
  tags: [agent_loop, anti_pattern]

- id: d1-007
  domain: D1
  weight: 27
  type: concept
  difficulty: medium
  scenarios: [customer_support, multi_agent_research]
  front: "Model-driven tool selection vs pre-configured decision trees?"
  back: "Model-driven: Claude picks tools from context each turn. Decision trees/forced sequences bypass model reasoning—use only when deterministic ordering is required."
  sources:
    - "Official CCAR-F Exam Guide — D1, Task 1.1"
  tags: [agent_loop, tool_selection]

- id: d1-008
  domain: D1
  weight: 27
  type: concept
  difficulty: easy
  scenarios: [customer_support, multi_agent_research]
  front: "Why append tool results to conversation history between loop iterations?"
  back: "So the model can reason about new information and choose the next action based on actual tool output."
  sources:
    - "Official CCAR-F Exam Guide — D1, Task 1.1"
  tags: [agent_loop, context]

- id: d1-009
  domain: D1
  weight: 27
  type: concept
  difficulty: medium
  scenarios: [multi_agent_research]
  front: "What is hub-and-spoke multi-agent architecture?"
  back: "Coordinator manages all inter-subagent communication, error handling, and information routing; subagents do not talk directly."
  sources:
    - "Official CCAR-F Exam Guide — D1, Task 1.2"
  tags: [orchestration, coordinator]
  exam_day: true

- id: d1-010
  domain: D1
  weight: 27
  type: concept
  difficulty: medium
  scenarios: [multi_agent_research]
  front: "Do subagents automatically inherit the coordinator's conversation history?"
  back: "No—subagents operate with isolated context; parent history is not inherited automatically."
  sources:
    - "Official CCAR-F Exam Guide — D1, Task 1.2–1.3"
  tags: [subagents, context]
  exam_day: true

