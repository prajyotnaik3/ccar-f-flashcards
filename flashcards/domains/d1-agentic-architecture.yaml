  domain: D1
  weight: 27
  type: decision
  difficulty: hard
  scenarios: [multi_agent_research]
  front: "Research on 'AI in creative industries' covers only visual arts—logs show coordinator assigned digital art, graphic design, photography only. Root cause?"
  back: "Coordinator task decomposition too narrow—subagents executed correctly but were assigned incomplete scope."
  sources:
    - "Official CCAR-F Exam Guide — D1, Task 1.2; Sample Q7"
