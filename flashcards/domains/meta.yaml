  front: Core heuristic when a scenario needs deterministic guarantees (money, identity, schema compliance)?
  back: Prefer structural/programmatic fixes (hooks, prerequisites, scoped tools, tool_use schemas) over prompt-only instructions.
  rationale: 'Exam tests judgment: prompts are insufficient for hard guarantees.'
