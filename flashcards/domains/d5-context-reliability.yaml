- id: d5-008
  domain: D5
  weight: 15
  type: concept
  difficulty: medium
  scenarios:
  - customer_support
  - multi_agent_research
  front: Why should you pass complete conversation history in subsequent API requests?
  back: Maintains conversational coherence—the model needs prior turns to reason about the ongoing case.
