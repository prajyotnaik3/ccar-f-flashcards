  type: concept
  difficulty: easy
  scenarios: [customer_support, multi_agent_research]
  front: "What is context rot in long agent sessions?"
  back: "Degraded reasoning as irrelevant history accumulates; mitigated by summarization, scoped context, and tool-first retrieval."
  sources:
    - "Official CCAR-F Exam Guide — D5"
  tags: [context]

- id: d5-002
