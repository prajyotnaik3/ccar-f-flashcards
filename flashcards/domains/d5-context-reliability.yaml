  weight: 15
  type: decision
  difficulty: medium
  scenarios:
  - customer_support
  front: "The customer is frustrated, but the issue is within the agent's capability. What should the agent do?"
  back: Acknowledge frustration and offer resolution; escalate only if customer reiterates preference for human.
  sources:
  - Official CCAR-F Exam Guide — D5, Task 5.2
  tags:
