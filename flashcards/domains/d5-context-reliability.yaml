- id: d5-011
  domain: D5
  weight: 15
  type: decision
  difficulty: medium
  scenarios:
  - customer_support
  front: 'First-contact resolution is 55%: the agent escalates easy cases and handles hard policy exceptions alone. What is the best calibration fix?'
  back: Add explicit escalation criteria with few-shot examples showing escalate vs resolve autonomously.
  sources:
  - Official CCAR-F Exam Guide — D5, Task 5.2; Sample Q3
  tags:
  - escalation
  - few_shot
  tasks:
  - '5.2'
  rationale: Explicit escalation criteria with few-shot examples fix unclear decision boundaries—the proportionate first fix. LLM self-reported confidence is poorly calibrated on hard cases; a separate classifier is over-engineered before prompt tuning; sentiment does not measure case complexity.
