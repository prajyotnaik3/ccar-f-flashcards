  weight: 15
  type: decision
  difficulty: medium
  scenarios: [multi_agent_research]
  front: "Subagents need prior search results. Best context passing approach?"
  back: "Explicit structured handoffs (IDs, snippets, citations) via coordinator—not assuming shared implicit memory."
