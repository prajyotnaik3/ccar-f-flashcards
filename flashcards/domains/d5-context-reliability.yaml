# Domain 5: Context Management & Reliability (15%)
# Task statements 5.1–5.6 from Official CCAR-F Exam Guide v1.0

- id: d5-001
  domain: D5
  weight: 15
  type: concept
  difficulty: easy
  scenarios:
  - customer_support
  - multi_agent_research
  - code_generation
  front: What is context degradation in long agent sessions?
  back: Reasoning quality drops as irrelevant history accumulates—inconsistent answers and vague 'typical pattern' references instead of specifics.
  sources:
  - Official CCAR-F Exam Guide — D5, Task 5.4
  tags:
  - context_degradation
  tasks:
  - '5.4'
- id: d5-002
  domain: D5
  weight: 15
  type: concept
  difficulty: medium
  scenarios:
  - customer_support
  - structured_extraction
  front: 'What is the risk of progressive summarization in long support sessions?'
  back: Condenses amounts, dates, percentages, and customer-stated expectations into vague summaries—loses critical transactional facts.
  sources:
  - Official CCAR-F Exam Guide — D5, Task 5.1
  tags:
  - summarization
  - case_facts
  exam_day: true
  tasks:
  - '5.1'
- id: d5-003
  domain: D5
  weight: 15
  type: concept
  difficulty: medium
  scenarios:
  - multi_agent_research
  - structured_extraction
  front: What is the 'lost in the middle' effect?
  back: Models reliably use info at the start and end of long inputs but may omit findings buried in middle sections.
  sources:
  - Official CCAR-F Exam Guide — D5, Task 5.1
  tags:
  - lost_in_middle
  - position
  tasks:
  - '5.1'
- id: d5-004
  domain: D5
  weight: 15
  type: decision
  difficulty: medium
  scenarios:
  - customer_support
  front: 'How do you preserve order amounts and dates across a long support conversation?'
  back: Extract transactional facts into a persistent case facts block in each prompt—outside summarized history.
  sources:
  - Official CCAR-F Exam Guide — D5, Task 5.1
  tags:
  - case_facts
  - context
  exam_day: true
  tasks:
  - '5.1'
  rationale: Keep amounts, dates, and order IDs in a persistent case-facts block outside summarized history so progressive summarization cannot wash them out.
- id: d5-005
  domain: D5
  weight: 15
  type: decision
  difficulty: medium
  scenarios:
  - customer_support
  front: 'Order lookup returns 40+ fields but only 5 matter for returns. How should you fix the context?'
  back: Trim verbose tool outputs to relevant fields before they accumulate in conversation context.
  sources:
  - Official CCAR-F Exam Guide — D5, Task 5.1
  tags:
  - trimming
  - tool_results
  tasks:
  - '5.1'
  rationale: Trim 40-field order payloads to the few return-relevant fields before they accumulate. Verbose tool results crowd out the facts that matter.
- id: d5-006
  domain: D5
  weight: 15
  type: decision
  difficulty: medium
  scenarios:
  - multi_agent_research
  front: 'How do you mitigate lost-in-the-middle when aggregating subagent results?'
  back: Place key findings summary at the beginning; organize detailed results with explicit section headers.
  sources:
  - Official CCAR-F Exam Guide — D5, Task 5.1
  tags:
  - lost_in_middle
  - aggregation
  tasks:
  - '5.1'
  rationale: 'Exam judgment aligned to task 5.1: Place key findings summary at the beginning; organize detailed results with explicit section headers.'
- id: d5-007
  domain: D5
  weight: 15
  type: decision
  difficulty: medium
  scenarios:
  - multi_agent_research
  front: 'The downstream synthesis agent has a limited context budget. How should upstream agents shape their output?'
  back: Return structured key facts, citations, and relevance scores—not verbose reasoning chains.
  sources:
  - Official CCAR-F Exam Guide — D5, Task 5.1
  tags:
  - structured_output
  - subagents
  tasks:
  - '5.1'
