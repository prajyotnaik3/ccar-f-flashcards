- id: d5-003
  domain: D5
  weight: 15
  type: decision
  difficulty: medium
  scenarios: [customer_support]
  front: "Agent loop fails twice on same tool error. Next step?"
  back: "Escalate or change strategy (alternate tool, human handoff, degraded path)—not infinite identical retries."
  sources:
    - "Official CCAR-F Exam Guide — D5"
