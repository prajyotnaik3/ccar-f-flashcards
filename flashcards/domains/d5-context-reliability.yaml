- id: d5-009
  domain: D5
  weight: 15
  type: decision
  difficulty: medium
  scenarios:
  - customer_support
  front: 'A support session covers multiple issues (billing and a return). How should you structure the context layer?'
  back: Persist structured issue data (order IDs, amounts, statuses) in a separate context layer for each concern.
  sources:
  - Official CCAR-F Exam Guide — D5, Task 5.1
  tags:
  - case_facts
  - multi_issue
  tasks:
  - '5.1'
  rationale: For billing plus a return, persist structured issue data (IDs, amounts, statuses) in a separate layer per concern so one summary does not merge them.
- id: d5-010
  domain: D5
  weight: 15
  type: concept
  difficulty: medium
  scenarios:
  - customer_support
  front: "Name three appropriate escalation triggers besides calling the case 'complex'."
  back: Customer explicitly requests human, policy exception/gap, and inability to make meaningful progress.
  sources:
  - Official CCAR-F Exam Guide — D5, Task 5.2
  tags:
  - escalation
  exam_day: true
  tasks:
