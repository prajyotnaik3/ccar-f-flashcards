- id: d5-019
  domain: D5
  weight: 15
  type: decision
  difficulty: hard
  scenarios:
  - multi_agent_research
  front: 'The web search subagent times out. What error context should you propagate to the coordinator?'
  back: 'Structured context: failure type, attempted query, partial results, and alternative approaches.'
  sources:
  - Official CCAR-F Exam Guide — D5, Task 5.3; Sample Q8
  tags:
  - error_propagation
  tasks:
  - '5.3'
  rationale: Structured error context enables coordinator recovery (retry, alternate query, partial results). Generic retry status hides context; marking failure as success blocks recovery; terminating the whole workflow is unnecessary when partial progress exists.
