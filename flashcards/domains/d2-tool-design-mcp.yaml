  domain: D2
  weight: 18
  type: concept
  difficulty: medium
  scenarios:
  - customer_support
  - developer_productivity
  front: How can system prompt wording undermine well-written tool descriptions?
  back: Keyword-sensitive instructions can create unintended tool associations that override description clarity.
  sources:
  - Official CCAR-F Exam Guide — D2, Task 2.1
  tags:
  - tool_descriptions
  - system_prompt
  tasks:
  - '2.1'
- id: d2-009
  domain: D2
  weight: 18
  type: decision
  difficulty: medium
  scenarios:
  - customer_support
  front: Tool selection is still wrong after improving descriptions. What should you check next?
  back: Review system prompt for keyword-sensitive instructions that might override tool descriptions.
  sources:
  - Official CCAR-F Exam Guide — D2, Task 2.1
  tags:
  - system_prompt
  - tool_descriptions
  tasks:
  - '2.1'
  rationale: After descriptions are fixed, check the system prompt. Keyword-sensitive instructions can create unintended tool associations that override good descriptions.
