- id: d2-023
  domain: D2
  weight: 18
  type: concept
  difficulty: medium
  scenarios:
  - customer_support
  - structured_extraction
  front: What are the three tool_choice configuration options on the Claude API?
  back: '"auto" (model may return text), "any" (must call a tool), and forced selection {"type": "tool", "name": "..."}.'
  sources:
  - Official CCAR-F Exam Guide — D2, Task 2.3; Appendix
  tags:
  - tool_choice
  exam_day: true
  tasks:
  - '2.3'
- id: d2-024
  domain: D2
  weight: 18
  type: decision
  difficulty: medium
  scenarios:
  - structured_extraction
  front: 'When should you set tool_choice to "any"?'
  back: When you need guaranteed tool invocation instead of conversational text—e.g., unknown document type among multiple extraction schemas.
  sources:
  - Official CCAR-F Exam Guide — D2, Task 2.3
  tags:
  - tool_choice
  tasks:
  - '2.3'
  rationale: tool_choice "any" forces a tool call (the model may choose which). Use it when you need structured extraction and the document type is unknown.
- id: d2-025
  domain: D2
  weight: 18
  type: decision
  difficulty: medium
  scenarios:
  - structured_extraction
  front: 'You must run extract_metadata before enrichment tools. How should you set tool_choice?'
  back: 'Force specific tool first with {"type": "tool", "name": "extract_metadata"}, then process enrichment in follow-up turns.'
  sources:
  - Official CCAR-F Exam Guide — D2, Task 2.3
  tags:
  - tool_choice
  - forced_tool
  tasks:
  - '2.3'
  rationale: 'Exam judgment aligned to task 2.3: Force specific tool first with {"type": "tool", "name": "extract_metadata"}, then process enrichment in follow-up turns.'
- id: d2-026
  domain: D2
  weight: 18
  type: decision
  difficulty: medium
  scenarios:
  - multi_agent_research
  front: Replace generic fetch_url with what kind of constrained tool?
  back: Purpose-specific tool like load_document that validates document URLs and rejects non-document URLs.
  sources:
  - Official CCAR-F Exam Guide — D2, Task 2.3
  tags:
  - tool_design
  - constraints
  tasks:
  - '2.3'
  rationale: 'Exam judgment aligned to task 2.3: Purpose-specific tool like load_document that validates document URLs and rejects non-document URLs.'
- id: d2-027
  domain: D2
  weight: 18
  type: decision
  difficulty: hard
  scenarios:
  - multi_agent_research
  front: 'Synthesis often needs simple fact-checks. What scoped cross-role tool pattern should you use?'
  back: Provide verify_fact for high-frequency simple lookups; route complex verification through coordinator to search agent.
  sources:
  - Official CCAR-F Exam Guide — D2, Task 2.3; D1 Sample Q9
  tags:
  - tool_scoping
  - verify_fact
  tasks:
  - '2.3'
  rationale: Scoped verify_fact on synthesis covers the common simple fact-check case while complex work stays with search via coordinator—least privilege. End-of-pass batching creates blocking dependencies; giving synthesis all search tools over-provisions; speculative caching cannot predict verification needs.
- id: d2-028
  domain: D2
  weight: 18
  type: decision
  difficulty: medium
  scenarios:
  - customer_support
  front: 'A refund tool should run only after verified identity. What tool-design choice enforces that?'
  back: 'Least privilege: narrow tool exposure or refund tool requiring verified session token from prior identity tool.'
  sources:
  - Official CCAR-F Exam Guide — D2, Task 2.3; Customer Support scenario
  tags:
  - tool_boundaries
  - least_privilege
  exam_day: true
  tasks:
  - '2.3'
  rationale: 'Least privilege: do not expose refund until identity is verified, or require a verified session token from get_customer. Prompts cannot guarantee ordering.'
- id: d2-029
  domain: D2
  weight: 18
  type: compare
  difficulty: medium
  scenarios:
  - developer_productivity
  front: 'How do project-level and user-level MCP server configurations differ?'
  back: Project .mcp.json for shared team tooling (version controlled); user ~/.claude.json for personal/experimental servers.
  sources:
  - Official CCAR-F Exam Guide — D2, Task 2.4
  tags:
  - mcp_config
  - scoping
  exam_day: true
  tasks:
  - '2.4'
- id: d2-030
  domain: D2
  weight: 18
  type: decision
  difficulty: medium
  scenarios:
  - developer_productivity
  front: 'How do you store a GitHub token for a team MCP server without committing secrets?'
  back: Environment variable expansion in .mcp.json (e.g., ${GITHUB_TOKEN}) with secrets in env—not in the repo.
  sources:
  - Official CCAR-F Exam Guide — D2, Task 2.4
  tags:
  - mcp_config
  - credentials
  tasks:
  - '2.4'
  rationale: 'Put ${GITHUB_TOKEN} (or similar) in project .mcp.json and keep the secret in the environment so the repo never contains credentials.'
