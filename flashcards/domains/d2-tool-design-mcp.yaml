- id: d2-045
  domain: D2
  weight: 18
  type: anti_pattern
  difficulty: medium
  scenarios: [customer_support]
  front: "Improve tool selection with keyword routing layer parsing user input each turn. Why often wrong?"
  back: "Over-engineered—bypasses LLM NLU; fix descriptions first; routing doesn't solve ordering or description gaps."
  sources:
    - "Official CCAR-F Exam Guide — D2, Task 2.1; Sample Q2"
  tags: [anti_pattern, routing]

- id: d2-046
  domain: D2
  weight: 18
  type: compare
  difficulty: medium
  scenarios: [developer_productivity]
  front: "MCP tools vs MCP resources—division of responsibility?"
  back: "Tools perform actions (fetch, update, search); resources expose catalogs and static context (schemas, doc trees) to cut exploratory calls."
  sources:
    - "Official CCAR-F Exam Guide — D2, Task 2.4; Appendix in-scope"
  tags: [mcp_tools, mcp_resources]

- id: d2-047
  domain: D2
  weight: 18
  type: concept
  difficulty: easy
  scenarios: [developer_productivity]
  front: "Why return structured isRetryable metadata on errors?"
  back: "Lets the agent retry transient failures and avoid wasted retries on non-retryable business or validation errors."
  sources:
    - "Official CCAR-F Exam Guide — D2, Task 2.2"
  tags: [errors, isRetryable]

