  domain: D2
  weight: 18
  type: concept
  difficulty: medium
  scenarios: [developer_productivity]
  front: "Developer Productivity scenario built-in tools (Exam Scenario 4)?"
  back: "Read, Write, Bash, Grep, Glob—plus MCP server integrations for external systems."
