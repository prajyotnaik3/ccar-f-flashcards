  domain: D2
  weight: 18
  type: concept
  difficulty: medium
  scenarios:
  - developer_productivity
  - multi_agent_research
  front: When should you use MCP resources instead of MCP tools?
  back: Resources expose content catalogs (issue summaries, doc hierarchies, DB schemas) to reduce exploratory tool calls.
  sources:
  - Official CCAR-F Exam Guide — D2, Task 2.4
  tags:
  - mcp_resources
  tasks:
  - '2.4'
- id: d2-033
  domain: D2
  weight: 18
  type: decision
  difficulty: medium
  scenarios:
  - developer_productivity
  front: 'The agent prefers Grep over a more capable MCP search tool. How do you fix that?'
  back: Enhance MCP tool descriptions to explain capabilities and outputs in detail so the model understands when MCP beats built-ins.
  sources:
  - Official CCAR-F Exam Guide — D2, Task 2.4
  tags:
  - tool_descriptions
  - mcp
  tasks:
  - '2.4'
  rationale: 'If Grep wins over a richer MCP search tool, the MCP description is too weak. Spell out capabilities and outputs so the model knows when MCP is better.'
- id: d2-034
  domain: D2
  weight: 18
  type: decision
  difficulty: easy
  scenarios:
  - developer_productivity
  front: 'You need Jira integration. Should you use a community MCP server or a custom one?'
  back: Prefer existing community MCP for standard integrations (Jira); custom servers for team-specific workflows.
  sources:
  - Official CCAR-F Exam Guide — D2, Task 2.4
  tags:
  - mcp_config
  - community
  tasks:
  - '2.4'
  rationale: 'Use a community MCP for standard SaaS (Jira). Reserve custom servers for team-specific workflows the community server cannot cover.'
- id: d2-035
  domain: D2
  weight: 18
  type: compare
  difficulty: medium
  scenarios:
  - developer_productivity
  front: 'When should you prefer custom MCP over built-in Claude Code tools?'
  back: MCP for external systems (GitHub, DB, SaaS) or sharing tools across clients; built-ins for local repo operations.
  sources:
  - Official CCAR-F Exam Guide — D2, Task 2.4–2.5
  tags:
