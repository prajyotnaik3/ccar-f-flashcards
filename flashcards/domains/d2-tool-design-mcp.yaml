  domain: D2
  weight: 18
  type: concept
  difficulty: medium
  scenarios: [customer_support]
  front: "Customer Support scenario MCP tools (Exam Scenario 1)—examples?"
  back: "get_customer, lookup_order, process_refund, escalate_to_human—backend integration via custom MCP tools."
  sources:
    - "Official CCAR-F Exam Guide — Scenario 1"
