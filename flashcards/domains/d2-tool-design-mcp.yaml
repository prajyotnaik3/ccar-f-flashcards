- id: d2-012
  domain: D2
  weight: 18
  type: concept
  difficulty: medium
  scenarios:
  - customer_support
  front: 'How should MCP tools communicate failures back to the agent?'
  back: The isError flag on tool results, plus structured error metadata—not raw stack traces or generic messages.
  sources:
  - Official CCAR-F Exam Guide — D2, Task 2.2
  tags:
  - errors
  - mcp
  - isError
  exam_day: true
  tasks:
  - '2.2'
- id: d2-013
  domain: D2
  weight: 18
  type: concept
  difficulty: medium
  scenarios:
  - customer_support
  - multi_agent_research
  front: 'Which four MCP error categories does the exam distinguish?'
  back: Transient (timeouts, unavailability), validation (invalid input), business (policy violations), permission (access denied).
  sources:
  - Official CCAR-F Exam Guide — D2, Task 2.2
  tags:
  - errors
  - error_category
  tasks:
  - '2.2'
- id: d2-014
  domain: D2
  weight: 18
  type: anti_pattern
  difficulty: medium
  scenarios:
  - customer_support
  front: Why is returning generic 'Operation failed' for all tool errors a problem?
  back: Prevents the agent from choosing appropriate recovery—retry, explain to user, escalate, or accept empty results.
  sources:
  - Official CCAR-F Exam Guide — D2, Task 2.2
  tags:
  - errors
  - anti_pattern
  tasks:
  - '2.2'
- id: d2-015
  domain: D2
  weight: 18
  type: decision
  difficulty: medium
  scenarios:
  - customer_support
  front: Name three structured error metadata fields for MCP tools.
  back: errorCategory (transient/validation/permission/business), isRetryable boolean, and human-readable description.
  sources:
  - Official CCAR-F Exam Guide — D2, Task 2.2
  tags:
  - errors
  - structured_errors
  exam_day: true
  tasks:
  - '2.2'
  rationale: 'Task 2.2 wants structured metadata: errorCategory, isRetryable, and a human-readable description so the agent can retry, explain, or stop.'
- id: d2-016
  domain: D2
  weight: 18
  type: decision
  difficulty: medium
  scenarios:
  - customer_support
  front: 'How should you design the error response for a business-rule violation (for example, a refund over the policy limit)?'
  back: 'isRetryable: false, customer-friendly explanation so the agent can communicate appropriately—not retry endlessly.'
  sources:
  - Official CCAR-F Exam Guide — D2, Task 2.2
  tags:
  - errors
  - business_errors
  tasks:
  - '2.2'
  rationale: 'Exam judgment aligned to task 2.2: isRetryable: false, customer-friendly explanation so the agent can communicate appropriately—not retry endlessly.'
- id: d2-017
  domain: D2
  weight: 18
  type: compare
  difficulty: hard
  scenarios:
  - customer_support
  - multi_agent_research
  front: Access failure (timeout) vs valid empty result (no matches)—how should tools report differently?
  back: 'Access failure: structured error with retry guidance. Valid empty: successful response indicating no matches—not an error.'
  sources:
  - Official CCAR-F Exam Guide — D2, Task 2.2
  tags:
  - errors
  - empty_results
  tasks:
  - '2.2'
- id: d2-018
  domain: D2
  weight: 18
  type: decision
  difficulty: medium
  scenarios:
  - multi_agent_research
  front: 'When a subagent hits a transient failure, when should it retry locally versus propagate to the coordinator?'
  back: Retry locally when possible; propagate only unresolved errors with partial results and what was attempted.
  sources:
  - Official CCAR-F Exam Guide — D2, Task 2.2
  tags:
  - errors
  - subagents
  tasks:
  - '2.2'
  rationale: 'Exam judgment aligned to task 2.2: Retry locally when possible; propagate only unresolved errors with partial results and what was attempted.'
- id: d2-019
  domain: D2
  weight: 18
  type: decision
  difficulty: medium
  scenarios:
  - customer_support
  front: A tool returns an ambiguous error from an external API. How should the tool layer behave?
  back: Structured error payload (category, message, retryable flag)—not raw stack traces or silent failure.
  sources:
  - Official CCAR-F Exam Guide — D2, Task 2.2
  tags:
  - errors
  - reliability
  tasks:
  - '2.2'
  rationale: Translate ambiguous API failures into category, message, and retryable flag. Raw stack traces and silent failures both block recovery.
