  domain: D2
  weight: 18
  type: concept
  difficulty: medium
  scenarios:
  - developer_productivity
  front: When are MCP tools from multiple servers available to the agent?
  back: All configured servers are discovered at connection time—tools from all servers are available simultaneously.
