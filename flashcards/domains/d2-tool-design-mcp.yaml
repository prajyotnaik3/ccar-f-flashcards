- id: d2-036
  domain: D2
  weight: 18
  type: concept
  difficulty: easy
  scenarios:
  - developer_productivity
  front: 'What is the primary use case for built-in Grep versus Glob?'
  back: 'Grep: search file contents for patterns (function names, errors, imports). Glob: match file paths by name/extension patterns.'
  sources:
  - Official CCAR-F Exam Guide — D2, Task 2.5
  tags:
  - builtin_tools
  - Grep
  - Glob
  exam_day: true
  tasks:
  - '2.5'
- id: d2-037
  domain: D2
  weight: 18
  type: decision
  difficulty: easy
  scenarios:
  - developer_productivity
  front: 'Which built-in tool finds all test files named *.test.tsx anywhere in the repo?'
  back: Glob with pattern like **/*.test.tsx.
  sources:
  - Official CCAR-F Exam Guide — D2, Task 2.5
  tags:
  - builtin_tools
  - Glob
  tasks:
  - '2.5'
  rationale: 'Glob matches file paths. **/*.test.tsx finds tests by name anywhere; Grep searches file contents, not filenames.'
- id: d2-038
  domain: D2
  weight: 18
  type: decision
  difficulty: medium
  scenarios:
  - developer_productivity
  front: 'Which built-in tool finds all callers of a function across the codebase?'
  back: Grep to search file contents for the function name/reference patterns.
  sources:
  - Official CCAR-F Exam Guide — D2, Task 2.5
  tags:
  - builtin_tools
  - Grep
  tasks:
  - '2.5'
  rationale: 'Callers are content matches. Grep for the function name; Glob would only find files whose names happen to match.'
- id: d2-039
  domain: D2
  weight: 18
  type: compare
  difficulty: medium
  scenarios:
  - developer_productivity
  front: 'When should you use Edit versus Read plus Write?'
  back: Edit for targeted changes with unique anchor text; Read + Write when Edit fails due to non-unique matches.
  sources:
  - Official CCAR-F Exam Guide — D2, Task 2.5
  tags:
  - builtin_tools
  - Edit
  - Read
  - Write
  tasks:
  - '2.5'
- id: d2-040
  domain: D2
  weight: 18
  type: decision
  difficulty: medium
  scenarios:
  - developer_productivity
  front: 'What is the best incremental pattern for exploring a codebase?'
  back: Grep for entry points → Read to follow imports and trace flows—not read all files upfront.
  sources:
  - Official CCAR-F Exam Guide — D2, Task 2.5
  tags:
  - builtin_tools
  - exploration
  tasks:
  - '2.5'
  rationale: Start with Grep for entry points, then Read along imports. Loading every file upfront wastes context and dilutes attention.
- id: d2-041
  domain: D2
  weight: 18
  type: decision
  difficulty: hard
  scenarios:
  - developer_productivity
  front: 'How do you trace usage across wrapper modules that export many names?'
  back: Identify all exported names first, then Grep for each name across the codebase.
  sources:
  - Official CCAR-F Exam Guide — D2, Task 2.5
  tags:
  - builtin_tools
  - Grep
  - exploration
  tasks:
  - '2.5'
  rationale: 'Wrapper modules re-export many names. List exports first, then Grep each name so you do not miss aliased callers.'
