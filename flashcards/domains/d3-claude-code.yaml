# Domain 3: Claude Code Configuration & Workflows (20%)
# Task statements 3.1–3.6 from Official CCAR-F Exam Guide v1.0

- id: d3-001
  domain: D3
  weight: 20
  type: concept
  difficulty: easy
  scenarios: [code_generation, developer_productivity]
  front: "What is CLAUDE.md in Claude Code workflows?"
  back: "Project instructions and context Claude Code loads to align behavior, conventions, and constraints."
  sources:
    - "Official CCAR-F Exam Guide — D3, Task 3.1"
    - "https://docs.anthropic.com/en/docs/claude-code/overview"
  tags: [claude_md]

- id: d3-002
  domain: D3
  weight: 20
  type: concept
  difficulty: medium
  scenarios: [code_generation, developer_productivity]
  front: "CLAUDE.md configuration hierarchy (three levels)?"
  back: "User (~/.claude/CLAUDE.md), project (.claude/CLAUDE.md or root CLAUDE.md), and directory-level (subdirectory CLAUDE.md files)."
  sources:
    - "Official CCAR-F Exam Guide — D3, Task 3.1"
  tags: [claude_md, hierarchy]
  exam_day: true

- id: d3-003
  domain: D3
  weight: 20
  type: decision
  difficulty: medium
  scenarios: [code_generation]
  front: "New teammate doesn't receive team coding standards in Claude Code. Likely cause?"
  back: "Instructions are in user-level ~/.claude/CLAUDE.md—not shared via version control; move to project-level config."
  sources:
    - "Official CCAR-F Exam Guide — D3, Task 3.1"
  tags: [claude_md, hierarchy]

- id: d3-004
  domain: D3
  weight: 20
  type: concept
  difficulty: medium
  scenarios: [code_generation]
  front: "What is @import syntax in CLAUDE.md?"
  back: "References external files to keep CLAUDE.md modular—import standards files relevant to each package."
  sources:
    - "Official CCAR-F Exam Guide — D3, Task 3.1"
  tags: [claude_md, import]

- id: d3-005
  domain: D3
  weight: 20
  type: decision
  difficulty: medium
  scenarios: [code_generation]
  front: "Monolithic CLAUDE.md is hard to maintain. Alternative organization?"
  back: "Split into focused files in .claude/rules/ (e.g., testing.md, api-conventions.md, deployment.md)."
  sources:
    - "Official CCAR-F Exam Guide — D3, Task 3.1"
  tags: [claude_md, rules]

- id: d3-006
  domain: D3
  weight: 20
  type: decision
  difficulty: medium
  scenarios: [code_generation]
  front: "Inconsistent Claude Code behavior across sessions—how diagnose loaded config?"
  back: "Use /memory to verify which memory files are loaded and what context is active."
  sources:
    - "Official CCAR-F Exam Guide — D3, Task 3.1"
  tags: [claude_md, memory]

- id: d3-007
  domain: D3
  weight: 20
  type: anti_pattern
  difficulty: medium
  scenarios: [code_generation]
  front: "Why skip shared project CLAUDE.md when multiple developers use Claude Code?"
  back: "Inconsistent conventions, duplicated prompt context, and drift in how the agent edits code across teammates."
  sources:
    - "Official CCAR-F Exam Guide — D3, Task 3.1"
  tags: [claude_md, team]

- id: d3-008
  domain: D3
  weight: 20
  type: decision
  difficulty: easy
  scenarios: [code_generation, ci_cd]
  front: "Team /review slash command for every developer on clone. Where create it?"
  back: ".claude/commands/ in the project repository—version-controlled and shared on clone/pull."
