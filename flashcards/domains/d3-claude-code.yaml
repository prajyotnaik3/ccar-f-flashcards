  domain: D3
  weight: 20
  type: decision
  difficulty: medium
  scenarios: [ci_cd]
  front: "CI test generation suggests scenarios already in the suite. Context fix?"
  back: "Provide existing test files in context so generation avoids duplicate coverage."
