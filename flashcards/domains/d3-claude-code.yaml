- id: d3-035
  domain: D3
  weight: 20
  type: concept
  difficulty: medium
  scenarios: [ci_cd]
  front: "Why use an independent Claude instance to review code it generated in the same session?"
  back: "Session context isolation—generator retains reasoning context and is less likely to question its own decisions."
  sources:
    - "Official CCAR-F Exam Guide — D3, Task 3.6"
  tags: [ci_cd, self_review]

- id: d3-036
  domain: D3
  weight: 20
  type: decision
  difficulty: medium
  scenarios: [ci_cd]
  front: "Re-run PR review after new commits—avoid duplicate inline comments?"
  back: "Include prior review findings in context; instruct Claude to report only new or still-unaddressed issues."
  sources:
    - "Official CCAR-F Exam Guide — D3, Task 3.6"
  tags: [ci_cd, review]

