- id: d3-021
  domain: D3
  weight: 20
  type: decision
  difficulty: hard
  scenarios:
  - code_generation
  front: 'You need to restructure a monolith into microservices across dozens of files. Which approach should you take first?'
  back: 'Plan mode: explore codebase, understand dependencies, design approach before making changes.'
  sources:
  - Official CCAR-F Exam Guide — D3, Task 3.4; Sample Q5
  tags:
  - plan_mode
  exam_day: true
  tasks:
  - '3.4'
  rationale: Plan mode fits large architectural work with exploration before edits. Direct execution risks rework when dependencies are unknown; upfront rigid instructions skip necessary discovery; switching only if complexity emerges ignores stated large-scale scope.
