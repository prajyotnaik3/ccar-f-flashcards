  weight: 20
  type: decision
  difficulty: medium
  scenarios: [code_generation]
  front: "Skill should only write files, not run destructive shell commands. Frontmatter?"
  back: "allowed-tools restricting tool access during skill execution (e.g., file write operations only)."
  sources:
    - "Official CCAR-F Exam Guide — D3, Task 3.2"
  tags: [skills, allowed_tools]

- id: d3-013
  domain: D3
  weight: 20
  type: decision
  difficulty: easy
  scenarios: [code_generation]
  front: "Developer invokes skill without required arguments. Frontmatter help?"
  back: "argument-hint prompts for required parameters when the skill is invoked without them."
  sources:
    - "Official CCAR-F Exam Guide — D3, Task 3.2"
  tags: [skills, argument_hint]

- id: d3-014
  domain: D3
  weight: 20
  type: compare
  difficulty: medium
  scenarios: [code_generation]
  front: "Skills vs CLAUDE.md—when use each?"
  back: "Skills: on-demand task-specific workflows. CLAUDE.md: always-loaded universal standards for the project."
  sources:
    - "Official CCAR-F Exam Guide — D3, Task 3.2"
  tags: [skills, claude_md]

- id: d3-015
  domain: D3
  weight: 20
  type: decision
  difficulty: medium
  scenarios: [code_generation]
  front: "Personal skill customization without affecting teammates?"
  back: "Create personal variants in ~/.claude/skills/ with different names—not in shared project skills."
  sources:
    - "Official CCAR-F Exam Guide — D3, Task 3.2"
  tags: [skills, scoping]

- id: d3-016
  domain: D3
  weight: 20
  type: concept
  difficulty: medium
  scenarios: [code_generation]
  front: "How do .claude/rules/ path-specific rules activate?"
  back: "YAML frontmatter paths field with glob patterns—rules load only when editing matching files."
  sources:
    - "Official CCAR-F Exam Guide — D3, Task 3.3"
  tags: [rules, path_scoping]
  exam_day: true

- id: d3-017
  domain: D3
  weight: 20
  type: decision
  difficulty: medium
  scenarios: [code_generation]
  front: "Test files spread as Button.test.tsx next to Button.tsx. Apply test conventions automatically?"
  back: ".claude/rules/ with glob paths like **/*.test.tsx—applies by file type across all directories."
  sources:
    - "Official CCAR-F Exam Guide — D3, Task 3.3; Sample Q6"
  tags: [rules, glob]

- id: d3-018
  domain: D3
  weight: 20
  type: decision
  difficulty: hard
  scenarios: [code_generation]
  front: "React, API, and DB areas need different conventions; tests scattered everywhere. Best maintainable approach?"
  back: ".claude/rules/ with YAML frontmatter glob patterns (e.g., paths: [\"**/*.test.tsx\"], [\"src/api/**/*\"])—not inference from one monolithic CLAUDE.md."
  sources:
    - "Official CCAR-F Exam Guide — D3, Task 3.3; Sample Q6"
  tags: [rules, glob]

- id: d3-019
  domain: D3
  weight: 20
  type: compare
  difficulty: medium
  scenarios: [code_generation]
  front: "Path-specific rules vs subdirectory CLAUDE.md for scattered test files?"
  back: "Path-specific glob rules apply by file pattern anywhere in the tree; subdirectory CLAUDE.md is directory-bound."
  sources:
    - "Official CCAR-F Exam Guide — D3, Task 3.3"
  tags: [rules, claude_md]

- id: d3-020
  domain: D3
  weight: 20
  type: concept
  difficulty: medium
  scenarios: [code_generation]
  front: "Benefit of path-scoped rules loading only on matching files?"
  back: "Reduces irrelevant context and token usage—conventions apply only when relevant."
  sources:
    - "Official CCAR-F Exam Guide — D3, Task 3.3"
  tags: [rules, context]

- id: d3-021
  domain: D3
  weight: 20
  type: decision
  difficulty: hard
  scenarios: [code_generation]
  front: "Restructure monolith into microservices—dozens of files, architectural decisions. Approach?"
  back: "Plan mode: explore codebase, understand dependencies, design approach before making changes."
  sources:
    - "Official CCAR-F Exam Guide — D3, Task 3.4; Sample Q5"
  tags: [plan_mode]
  exam_day: true

- id: d3-022
  domain: D3
  weight: 20
  type: compare
  difficulty: medium
  scenarios: [code_generation]
  front: "Plan mode vs direct execution—when use each?"
  back: "Plan mode: large-scale, multi-file, architectural, multiple valid approaches. Direct execution: simple, well-scoped single changes."
  sources:
    - "Official CCAR-F Exam Guide — D3, Task 3.4"
  tags: [plan_mode, direct_execution]
  exam_day: true

