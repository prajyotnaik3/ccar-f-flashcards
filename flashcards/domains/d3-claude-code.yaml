  domain: D3
  weight: 20
  type: compare
  difficulty: medium
  scenarios: [code_generation]
  front: "Project-scoped vs user-scoped slash commands?"
  back: ".claude/commands/ in repo (shared via git) vs ~/.claude/commands/ (personal, not version controlled)."
  sources:
    - "Official CCAR-F Exam Guide — D3, Task 3.2"
