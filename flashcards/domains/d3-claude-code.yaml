  weight: 20
  type: decision
  difficulty: medium
  scenarios: [ci_cd, code_generation]
  front: "Reduce low-value generated tests in Claude Code?"
  back: "Document testing standards, valuable test criteria, and available fixtures in CLAUDE.md."
  sources:
    - "Official CCAR-F Exam Guide — D3, Task 3.6"
