- id: d4-026
  domain: D4
  weight: 20
  type: decision
  difficulty: medium
  scenarios:
  - structured_extraction
  front: Extraction misses nullable fields intermittently. What is the best improvement?
  back: Tighten required vs optional schema, validation-retry loop, and explicit examples for null/edge cases.
  sources:
  - Official CCAR-F Exam Guide — D4, Task 4.3–4.4; Structured Extraction scenario
  tags:
  - validation
  - nullable
