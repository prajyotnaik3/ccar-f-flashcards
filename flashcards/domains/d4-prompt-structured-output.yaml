  domain: D4
  weight: 20
  type: decision
  difficulty: medium
  scenarios:
  - structured_extraction
  front: 'The source document may omit a field. How should you design the schema to prevent fabrication?'
  back: Make fields optional/nullable when information may be absent—don't require fields the source lacks.
  sources:
  - Official CCAR-F Exam Guide — D4, Task 4.3
  tags:
  - schema_design
  - nullable
  exam_day: true
  tasks:
  - '4.3'
