- id: d4-034
  domain: D4
  weight: 20
  type: decision
  difficulty: medium
  scenarios:
  - ci_cd
  front: What is the best approach to catch subtle issues in AI-generated code?
  back: Second independent Claude instance reviewing without the generator's reasoning context.
  sources:
  - Official CCAR-F Exam Guide — D4, Task 4.6
  tags:
  - multi_instance
  - review
  tasks:
  - '4.6'
  rationale: A second Claude instance without the generator's reasoning context catches subtle bugs better than same-session self-review or extended thinking alone.
- id: d4-035
  domain: D4
  weight: 20
  type: decision
  difficulty: medium
  scenarios:
  - ci_cd
  front: 'For a large multi-file PR review, what multi-pass architecture should you use?'
  back: Per-file passes for local issues plus separate integration pass for cross-file data flow.
  sources:
  - Official CCAR-F Exam Guide — D4, Task 4.6; Sample Q12
  tags:
  - multi_pass
  - review
  tasks:
  - '4.6'
  rationale: Split reviews into per-file passes plus a cross-file integration pass—fixes attention dilution across many files. Splitting PRs burdens developers; larger context does not fix attention quality; consensus across passes would suppress intermittently caught bugs.
- id: d4-036
  domain: D4
  weight: 20
  type: decision
  difficulty: medium
  scenarios:
  - ci_cd
  front: 'How should you route automated review findings to human triage?'
  back: Run a verification pass where the model reports confidence alongside each finding, then route using calibrated thresholds (high-severity / low-confidence to humans).
  sources:
  - Official CCAR-F Exam Guide — D4, Task 4.6
  tags:
  - review
  - confidence
  tasks:
  - '4.6'
  rationale: Task 4.6 uses a verification pass with self-reported confidence for calibrated routing. That is different from using uncalibrated confidence as an escalation trigger in support.
