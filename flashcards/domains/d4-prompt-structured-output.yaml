- id: d4-016
  domain: D4
  weight: 20
  type: decision
  difficulty: medium
  scenarios:
  - structured_extraction
  front: 'What schema pattern should you use for an extensible category field?'
  back: Enum with "other" plus a detail string field for categories not in the predefined list.
  sources:
  - Official CCAR-F Exam Guide — D4, Task 4.3
  tags:
  - schema_design
  - enum
  tasks:
  - '4.3'
  rationale: 'Use an enum plus an ''other'' value and a detail string so unknown categories are captured instead of forced into a wrong bucket.'
