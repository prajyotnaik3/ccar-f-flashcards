- id: d4-031
  domain: D4
  weight: 20
  type: decision
  difficulty: medium
  scenarios:
  - structured_extraction
  front: 'How should you resubmit failed documents from a batch job?'
  back: Resubmit only failed documents by custom_id with modifications (e.g., chunk oversized docs that exceeded context).
  sources:
  - Official CCAR-F Exam Guide — D4, Task 4.5
  tags:
  - batch_api
  - failures
  tasks:
  - '4.5'
  rationale: Resubmit only failed custom_id items, with fixes such as chunking docs that exceeded context. Do not resubmit the whole batch.
