  domain: D4
  weight: 20
  type: decision
  difficulty: medium
  scenarios:
  - structured_extraction
  front: 'Source data can be ambiguous. How should you design the extraction enum?'
  back: Add enum value like "unclear" for ambiguous cases rather than forcing a wrong category.
  sources:
  - Official CCAR-F Exam Guide — D4, Task 4.3
  tags:
  - schema_design
  - enum
  tasks:
  - '4.3'
  rationale: 'Exam judgment aligned to task 4.3: Add enum value like "unclear" for ambiguous cases rather than forcing a wrong category.'
