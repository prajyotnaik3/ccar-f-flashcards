- id: d4-028
  domain: D4
  weight: 20
  type: decision
  difficulty: medium
  scenarios:
  - ci_cd
  front: 'Should you use the Batch API for both a pre-merge blocking check and an overnight technical-debt report?'
  back: Batch only for latency-tolerant jobs (overnight reports); keep synchronous API for blocking pre-merge checks.
  sources:
  - Official CCAR-F Exam Guide — D4, Task 4.5; Sample Q11
  tags:
  - batch_api
  - latency
  tasks:
  - '4.5'
  rationale: Message Batches save cost but lack latency SLA—fine for overnight reports, unsuitable for blocking pre-merge checks. Polling batches for merge gates is unacceptable; custom_id correlates batch results; timeout fallback adds complexity vs matching API to workflow latency needs.
- id: d4-029
  domain: D4
  weight: 20
  type: concept
  difficulty: medium
  scenarios:
  - structured_extraction
  front: 'What is the Message Batches API limitation on tool calling?'
  back: No multi-turn tool calling within a single batch request—cannot execute tools mid-request and return results.
  sources:
  - Official CCAR-F Exam Guide — D4, Task 4.5
  tags:
  - batch_api
  - tool_use
  tasks:
  - '4.5'
