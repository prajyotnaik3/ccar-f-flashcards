# Domain 4: Prompt Engineering & Structured Output (20%)
# Task statements 4.1–4.6 from Official CCAR-F Exam Guide v1.0

- id: d4-001
  domain: D4
  weight: 20
  type: concept
  difficulty: easy
  scenarios:
  - structured_extraction
  - ci_cd
  front: Why should you use structured output (JSON schema) instead of parsing free-text responses?
  back: Enables validation, automated retries on failure, and downstream automation without fragile regex on prose.
  sources:
  - Official CCAR-F Exam Guide — D4, Task 4.3
  - https://docs.anthropic.com/en/docs/build-with-claude/structured-outputs
  tags:
  - structured_output
  tasks:
  - '4.3'
- id: d4-002
  domain: D4
  weight: 20
  type: compare
  difficulty: medium
  scenarios:
  - ci_cd
  front: "Why are explicit review criteria better than vague instructions like 'be conservative'?"
  back: Specific categorical criteria (flag when comment contradicts code) beat vague confidence filtering for precision.
  sources:
  - Official CCAR-F Exam Guide — D4, Task 4.1
  tags:
  - prompt_criteria
  - false_positives
  exam_day: true
  tasks:
  - '4.1'
- id: d4-003
  domain: D4
  weight: 20
  type: decision
  difficulty: medium
  scenarios:
  - ci_cd
  front: Automated review has high false positives in one category, and developers ignore all findings. What should you do first?
  back: Temporarily disable the high false-positive category to restore trust while improving prompts for that category.
  sources:
  - Official CCAR-F Exam Guide — D4, Task 4.1
  tags:
  - false_positives
  - review
  tasks:
  - '4.1'
  rationale: High false positives in one category destroy trust in every category. Disable that category while you tighten its prompt, then turn it back on.
