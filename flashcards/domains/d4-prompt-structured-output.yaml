  domain: D4
  weight: 20
  type: concept
  difficulty: hard
  scenarios:
  - structured_extraction
  front: Why is self-review of generated code in the same session limited?
  back: Model retains generation reasoning context—less likely to question its own decisions than an independent reviewer.
  sources:
  - Official CCAR-F Exam Guide — D4, Task 4.6
  tags:
