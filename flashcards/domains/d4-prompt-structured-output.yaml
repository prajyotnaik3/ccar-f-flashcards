  domain: D4
  weight: 20
  type: decision
  difficulty: medium
  scenarios:
  - structured_extraction
  front: 'Source documents have inconsistent date formats, but the output schema is strict. What should you do?'
  back: Include format normalization rules in the prompt alongside the strict output schema.
  sources:
  - Official CCAR-F Exam Guide — D4, Task 4.3
  tags:
  - schema_design
  - normalization
  tasks:
  - '4.3'
  rationale: Keep the output schema strict, and put date-normalization rules in the prompt so inconsistent source formats still map to one output shape.
