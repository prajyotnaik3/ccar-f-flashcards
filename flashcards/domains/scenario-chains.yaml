# Scenario chain cards — sequential judgment drills per exam scenario
# Filter: domain CHAIN, type scenario_chain, or by scenario tag

- id: sc-001
  domain: CHAIN
  type: scenario_chain
  difficulty: medium
  scenarios: [customer_support]
  chain:
    scenario: customer_support
    step: 1
    steps: 5
  front: "[Customer Support · 1/5] You deploy a support agent with MCP tools (get_customer, lookup_order, process_refund, escalate_to_human). Target is 80%+ first-contact resolution. What architectural foundation comes first?"
  back: Design agentic loop with stop_reason control, scoped tools, and escalation paths—before tuning prompts.
  sources:
    - Official CCAR-F Exam Guide — Scenario 1
    - Official CCAR-F Exam Guide — D1, Task 1.1
  tags: [scenario_chain, customer_support]
  tasks: ['1.1', '1.4']

- id: sc-002
  domain: CHAIN
  type: scenario_chain
  difficulty: hard
  scenarios: [customer_support]
  chain:
    scenario: customer_support
    step: 2
    steps: 5
  front: "[Customer Support · 2/5] Production data: 12% of cases skip get_customer and call lookup_order by name only, causing wrong refunds. Best fix?"
  back: Programmatic prerequisite blocking lookup_order and process_refund until get_customer returns verified customer ID.
  rationale: Money and identity need deterministic enforcement—not prompts alone.
  sources:
    - Official CCAR-F Exam Guide — Scenario 1; Sample Q1
    - Official CCAR-F Exam Guide — D1, Task 1.4
  tags: [scenario_chain, customer_support]
  tasks: ['1.4']
  exam_day: true

