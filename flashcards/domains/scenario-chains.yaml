- id: sc-006
  domain: CHAIN
  type: scenario_chain
  difficulty: easy
  scenarios: [code_generation]
  chain:
    scenario: code_generation
    step: 1
    steps: 5
  front: "[Code Generation · 1/5] Your team uses Claude Code for generation, refactoring, and docs—with slash commands, CLAUDE.md, and plan mode. What should be shared via git for consistent team behavior?"
  back: Project-level CLAUDE.md, .claude/commands/, .claude/rules/, and .mcp.json—not user-only ~/.claude config.
